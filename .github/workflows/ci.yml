name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements/requirements.txt ruff==0.16.5 pytest
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest tests/ -q
      - name: Leak check
        run: bash scripts/leakcheck.sh
